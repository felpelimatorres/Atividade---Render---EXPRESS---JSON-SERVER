<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Pessoa - PUT</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CRUD de Pessoas - Node.js + Express + JSON Server</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="create.html">Criar (POST)</a>
            <a href="read.html">Listar (GET)</a>
            <a href="update.html" class="ativo">Editar (PUT)</a>
            <a href="delete.html">Excluir (DELETE)</a>
        </nav>
    </header>
    <main>
        <div class="card">
            <h2>Buscar pessoa</h2>
            <div class="grid-form">
                <div class="campo">
                    <label for="rgBusca">RG</label>
                    <input type="text" id="rgBusca" placeholder="Digite o RG para buscar">
                </div>
            </div>
            <div class="acoes">
                <button type="button" class="secundario" id="btnBuscar">Buscar</button>
            </div>
        </div>

        <br>

        <div class="card">
            <h2>Atualizar pessoa (PUT)</h2>
            <form id="formAtualizar">
                <div class="grid-form">
                    <div class="campo">
                        <label for="id">ID</label>
                        <input type="text" id="id" readonly>
                    </div>
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="campo">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="0" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" required>
                    </div>
                    <div class="campo">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" required>
                    </div>
                    <div class="campo full">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" required>
                    </div>
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" required>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" maxlength="2" required>
                    </div>
                </div>
                <div class="acoes">
                    <button type="submit" class="primario">Atualizar</button>
                    <button type="reset" class="secundario">Limpar</button>
                </div>
                <div id="mensagem" class="mensagem"></div>
            </form>
        </div>
    </main>

    <script src="put/update.js"></script>
</body>
</html>
