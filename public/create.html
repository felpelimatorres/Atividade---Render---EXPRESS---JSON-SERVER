<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Pessoa - POST</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>CRUD de Pessoas - Node.js + Express + JSON Server</h1>
        <nav>
            <a href="index.html">Início</a>
            <a href="create.html" class="ativo">Criar (POST)</a>
            <a href="read.html">Listar (GET)</a>
            <a href="update.html">Editar (PUT)</a>
            <a href="delete.html">Excluir (DELETE)</a>
        </nav>
    </header>
    <main>
        <div class="card">
            <h2>Cadastrar nova pessoa (POST)</h2>
            <form id="formCriar">
                <div class="grid-form">
                    <div class="campo">
                        <label for="nome">Nome</label>
                        <input type="text" id="nome" required>
                    </div>
                    <div class="campo">
                        <label for="sobrenome">Sobrenome</label>
                        <input type="text" id="sobrenome" required>
                    </div>
                    <div class="campo">
                        <label for="email">E-mail</label>
                        <input type="email" id="email" required>
                    </div>
                    <div class="campo">
                        <label for="idade">Idade</label>
                        <input type="number" id="idade" min="0" required>
                    </div>
                    <div class="campo">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="campo">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" required>
                    </div>
                    <div class="campo full">
                        <label for="rua">Rua</label>
                        <input type="text" id="rua" required>
                    </div>
                    <div class="campo">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" required>
                    </div>
                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>
                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" maxlength="2" placeholder="UF" required>
                    </div>
                </div>
                <div class="acoes">
                    <button type="submit" class="primario">Salvar</button>
                    <button type="reset" class="secundario">Limpar</button>
                </div>
                <div id="mensagem" class="mensagem"></div>
            </form>
        </div>
    </main>

    <script src="post/create.js"></script>
</body>
</html>
